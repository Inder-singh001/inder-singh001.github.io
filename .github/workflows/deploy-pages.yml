name: Deploy portfolio to GitHub Pages

# Publishes the site via BOTH Pages mechanisms so it works with either
# repo setting (Settings -> Pages -> Source):
#   - "Deploy from a branch" (gh-pages / root): the gh-pages push job
#   - "GitHub Actions": the deploy-pages artifact job

on:
  push:
    branches:
      - main
      - cursor/3d-portfolio-website-e9dd
    # Only source changes trigger the workflow; the built-site commit it
    # pushes to main touches only root artifacts, so no trigger loop.
    paths:
      - 'portfolio/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: portfolio
      - name: Build
        run: npm run build
        working-directory: portfolio
        # Repo is the user site (inder-singh001.github.io), served at the
        # domain root, so the default base path '/' is correct.
      - name: Prepare Pages artifacts
        run: |
          touch portfolio/dist/.nojekyll
          cp portfolio/dist/index.html portfolio/dist/404.html
      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: portfolio/dist
          force_orphan: true
      # Pages on this repo serves from the root of main, so also sync the
