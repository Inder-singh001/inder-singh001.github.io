name: Deploy portfolio to GitHub Pages

# Builds the site and pushes it to the gh-pages branch.
# One-time repo setting required: Settings -> Pages -> Source:
# "Deploy from a branch" -> gh-pages -> / (root).

on:
  push:
    branches:
      - main
      - cursor/3d-portfolio-website-e9dd
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: portfolio
      - name: Build
        run: npm run build
        working-directory: portfolio
        env:
          BASE_PATH: /Portfolio/
      - name: Prepare Pages artifacts
        run: |
          touch portfolio/dist/.nojekyll
          cp portfolio/dist/index.html portfolio/dist/404.html
      - name: Push to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: portfolio/dist
          force_orphan: true
