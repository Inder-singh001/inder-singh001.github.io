          path: portfolio/dist

  # Only succeeds when Pages source is set to "GitHub Actions";
  # harmless (and ignorable) when source is the gh-pages branch.
  deploy-actions-source:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
